services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ta_v2_face_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-face_registration}
      POSTGRES_USER: ${POSTGRES_USER:-face_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_STRONG_DB_PASSWORD}
    volumes:
      - ta_v2_pgdata:/var/lib/postgresql/data
      - ./Website/Back-end/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # Sengaja TIDAK expose port 5432 ke host agar tidak bentrok dengan DB lain di VPS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_app_user} -d ${POSTGRES_DB:-face_registration}"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ta_v2_face_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-face_app_user}:${POSTGRES_PASSWORD:-CHANGE_STRONG_DB_PASSWORD}@db:5432/${POSTGRES_DB:-face_registration}
      FACE_DEVICE: cpu
    ports:
      # Port 8010 (aman dari port 8000 milik aplikasi temanmu). Ubah APP_HOST_BIND=127.0.0.1 jika sudah pakai Nginx HTTPS.
      - "${APP_HOST_BIND:-0.0.0.0}:${APP_HOST_PORT:-8010}:8000"
    volumes:
      # Mount 2 file bobot model secara read-only dari VPS (tidak perlu masuk GitHub/Docker image)
      - "./Face Recognition/artifacts/exported_models/imsfd_partial_ft_v1/inceptionresnetv1_imsfd_partial_finetuned.pth:/app/Face Recognition/artifacts/exported_models/imsfd_partial_ft_v1/inceptionresnetv1_imsfd_partial_finetuned.pth:ro"
      - "./Face Recognition/artifacts/antispoof/weights/2.7_80x80_MiniFASNetV2.pth:/app/Face Recognition/artifacts/antispoof/weights/2.7_80x80_MiniFASNetV2.pth:ro"

volumes:
  ta_v2_pgdata:
