# Simpan di VPS Hostinger: /etc/nginx/sites-available/ta-v2-face
# Ganti ujian.domain-kamu.com dengan subdomain milikmu, lalu aktifkan SSL dengan:
#   sudo ln -s /etc/nginx/sites-available/ta-v2-face /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ujian.domain-kamu.com

server {
    listen 80;
    server_name ujian.domain-kamu.com;

    # Izinkan upload frame kamera resolusi tinggi hingga 10 MB
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Opsional: tutup akses publik ke /metrics agar hanya bisa diakses lokal VPS
    location /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8010/metrics;
    }
}
